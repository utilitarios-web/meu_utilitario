<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação - Lucro Certo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8fafc;
            border-radius: 6px;
            border-left: 4px solid #2563eb;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .result-item strong { color: #16a34a; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Precificação</h2>

        <div class="form-group">
            <label for="cost">Custo do Produto/Serviço (R$)</label>
            <input type="number" id="cost" placeholder="Ex: 50.00" step="0.01">
        </div>

        <div class="form-group">
            <label for="expenses">Custos Adicionais / Impostos (%)</label>
            <input type="number" id="expenses" placeholder="Ex: 10" step="0.1">
        </div>

        <div class="form-group">
            <label for="margin">Margem de Lucro Desejada (%)</label>
            <input type="number" id="margin" placeholder="Ex: 30" step="0.1">
        </div>

        <button onclick="calculatePrice()">Calcular Preço de Venda</button>

        <div class="result" id="resultContainer">
            <div class="result-item">
                <span>Preço Final Recomendado:</span>
                <strong id="finalPrice">R$ 0,00</strong>
            </div>
            <div class="result-item">
                <span>Lucro Líquido por Venda:</span>
                <span id="netProfit">R$ 0,00</span>
            </div>
        </div>
    </div>

    <script>
        function calculatePrice() {
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            const expenses = parseFloat(document.getElementById('expenses').value) || 0;
            const margin = parseFloat(document.getElementById('margin').value) || 0;

            if (cost <= 0) {
                alert("Por favor, insira um valor de custo válido.");
                return;
            }

            // Cálculo da margem bruta com base no Markup
            const totalTaxAndMarginPercentage = (expenses + margin) / 100;

            if (totalTaxAndMarginPercentage >= 1) {
                alert("A soma das porcentagens não pode ser igual ou superior a 100%.");
                return;
            }

            const sellingPrice = cost / (1 - totalTaxAndMarginPercentage);
            const profit = sellingPrice * (margin / 100);

            document.getElementById('finalPrice').innerText = 'R$ ' + sellingPrice.toFixed(2);
            document.getElementById('netProfit').innerText = 'R$ ' + profit.toFixed(2);
            document.getElementById('resultContainer').style.display = 'block';
        }
    </script>
</body>
</html>
